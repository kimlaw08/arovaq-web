<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arovaq | List Your Digital Product</title>
    <!-- Include Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #131b2e;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #1e293b;
        }
        h2 { color: #f59e0b; text-align: center; margin-bottom: 8px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 List on Arovaq</h2>
    <p class="subtitle">Keep up to 96% and unlock automated affiliate splits.</p>
    
    <form id="productForm">
        <label>Creator Name / Handle</label>
        <input type="text" id="creatorName" placeholder="e.g. Lawrence Crypto" required>

        <label>Product Title</label>
        <input type="text" id="productTitle" placeholder="e.g. Web3 Masterclass E-Book" required>

        <label>Description</label>
        <textarea id="productDesc" rows="3" placeholder="Briefly describe your digital product..." required></textarea>

        <label>Price (KES)</label>
        <input type="number" id="productPrice" placeholder="e.g. 1500" required>

        <label>Product Download Link / File URL</label>
        <input type="url" id="productLink" placeholder="https://..." required>

        <label>Payout Phone (M-Pesa) or Wallet Address</label>
        <input type="text" id="payoutInfo" placeholder="07XXXXXXXX or Solana Address" required>

        <button type="submit" id="submitBtn">Submit for Pre-Launch</button>
    </form>
</div>

<script>
    // Initialize Supabase Client (Replace with your actual Supabase URL and Anon Key)
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('productForm').addEventListener('submit async', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = 'Submitting...';

        const productData = {
            creator_name: document.getElementById('creatorName').value,
            title: document.getElementById('productTitle').value,
            description: document.getElementById('productDesc').value,
            price: parseFloat(document.getElementById('productPrice').value),
            asset_url: document.getElementById('productLink').value,
            payout_info: document.getElementById('payoutInfo').value,
            status: 'pending_review'
        };

        const { data, error } = await supabaseClient
            .from('products')
            .insert([productData]);

        if (error) {
            alert('Error submitting product: ' + error.message);
            btn.innerText = 'Submit for Pre-Launch';
        } else {
            alert('Success! Your product has been submitted for pre-launch review.');
            document.getElementById('productForm').reset();
            btn.innerText = 'Submitted Successfully!';
        }
    });
</script>

</body>
</html>
